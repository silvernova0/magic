version: '3.8'

services:
  jankbuild:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jankbuild
    ports:
      - "3002:3000"  # Map internal port 3000 to host port 3002
    environment:
      - NODE_ENV=production
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=https://jankbuild.com  # Update with your domain
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=file:./prisma/dev.db
    volumes:
      - ./prisma:/app/prisma
      - ./data:/app/data
      - jankbuild-data:/app/.next
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  jankbuild-data:
    driver: local

networks:
  default:
    name: jankbuild-network
